[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-designer"
dynamic = ["version"]
description = "Protocol Designer & Analyzer - declarative protocol definition, analysis, test and code generation platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "PySide6-Essentials>=6.5",
    "pyserial>=3.5",
    "python-can>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4.2", "pyinstaller>=6.0"]

[project.scripts]
protocol-designer-cli = "protocol_designer.cli:main"

[project.gui-scripts]
protocol-designer = "protocol_designer.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "protocol_designer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protocol_designer = ["resources/*", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
